# UiKit page contract (REQ-UI-003): one host layout and one theme for every bundle page.
nowo_ui_kit:
    css_framework: bootstrap5
    icon_set: bootstrap-icons
    layouts:
        admin: 'layouts/admin.html.twig'
    breadcrumbs:
        breadcrumb_kit: true          # page headers render this app's BreadcrumbKit trail (collection "default")
    theme:
        tokens:
            primary: '#2c3e50'
            primary-contrast: '#ffffff'
            surface: '#ffffff'
            surface-muted: '#f4f6f8'
            border: '#dee2e6'
            radius: '0.5rem'
