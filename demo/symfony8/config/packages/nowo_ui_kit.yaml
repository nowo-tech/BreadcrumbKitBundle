# REQ-DEMO-014 / REQ-UI-003: UiKit default theme, unchanged (no token overrides); one host layout for every bundle page.
nowo_ui_kit:
    css_framework: custom
    icon_set: none
    layouts:
        admin: 'layouts/admin.html.twig'
    breadcrumbs:
        breadcrumb_kit: true          # page headers render this app's BreadcrumbKit trail (collection "default")
