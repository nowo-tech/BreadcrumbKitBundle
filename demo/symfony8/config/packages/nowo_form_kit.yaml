# Form Kit — profile `breadcrumb_kit` is prepended by BreadcrumbKitExtension.
# Host can override here; keep NowoFormKitBundle registered in bundles.php.
nowo_form_kit:
    # Profile classes are UiKit semantic classes (REQ-DEMO-014).
    default_profile: default
    profiles:
        default:
            alias: default
            translation_domain: messages
            defaults:
                attr:
                    class: nowo-ui-input
                row_attr:
                    class: nowo-ui-form-row
