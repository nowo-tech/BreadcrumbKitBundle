# Constraint messages (validators domain; REQ-I18N-003). Translated by the validator, not by the form theme.
form:
  icon:
    invalid: 'Icon not allowed: use text, an emoji, inline SVG or simple inline HTML (e.g. <i class="bi bi-house"></i>) without scripts, event handlers or external links.'
  import_breadcrumb:
    file:
      required: Please choose a file.
      mime: The file must be JSON.
  breadcrumb_item:
    route_name.not_blank: Enter a route name.
    path_pattern.invalid: 'Invalid path pattern: it must be a valid regular expression body (used as #…#u) without nested quantifiers such as (a+)+.'
