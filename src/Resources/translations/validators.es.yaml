# Constraint messages (validators domain; REQ-I18N-003). Translated by the validator, not by the form theme.
nowo_breadcrumb_kit:
  form:
    icon:
      invalid: 'Icono no permitido: usa texto, un emoji, SVG en línea o HTML en línea simple (p. ej. <i class="bi bi-house"></i>) sin scripts, manejadores de eventos ni enlaces externos.'
    import_breadcrumb:
      file:
        required: Selecciona un archivo.
        mime: El archivo debe ser JSON.
    breadcrumb_item:
      route_name.not_blank: Indica un nombre de ruta.
      path_pattern.invalid: 'Patrón de ruta no válido: debe ser el cuerpo de una expresión regular válida (se usa como #…#u) sin cuantificadores anidados como (a+)+.'
