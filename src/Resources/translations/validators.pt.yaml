# Constraint messages (validators domain; REQ-I18N-003). Translated by the validator, not by the form theme.
nowo_breadcrumb_kit:
  form:
    icon:
      invalid: 'Ícone não permitido: use texto, um emoji, SVG inline ou HTML inline simples (p. ex. <i class="bi bi-house"></i>) sem scripts, manipuladores de eventos ou links externos.'
    import_breadcrumb:
      file:
        required: Escolha um ficheiro.
        mime: O ficheiro deve ser JSON.
    breadcrumb_item:
      route_name.not_blank: Indique um nome de rota.
      path_pattern.invalid: 'Padrão de caminho inválido: deve ser uma expressão regular válida (usada como #…#u) sem quantificadores aninhados como (a+)+.'
