services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
    bind:
      # 2.16 (rule 6): the manager of the breadcrumb entities, never the host's default manager by accident.
      Doctrine\ORM\EntityManagerInterface $entityManager: '@nowo_breadcrumb_kit.entity_manager'

  Nowo\BreadcrumbKitBundle\Repository\BreadcrumbCollectionRepository:
    public: true

  Nowo\BreadcrumbKitBundle\Repository\BreadcrumbItemRepository:
    public: true

  Nowo\BreadcrumbKitBundle\Service\BreadcrumbUrlResolver:
    public: true
    arguments:
      $routerDefaultLocale: '%kernel.default_locale%'

  Nowo\BreadcrumbKitBundle\Service\BreadcrumbUrlResolverInterface:
    alias: Nowo\BreadcrumbKitBundle\Service\BreadcrumbUrlResolver

  Nowo\BreadcrumbKitBundle\Profiler\BreadcrumbProfilerRecorder:
    arguments:
      $debug: '%kernel.debug%'

  Nowo\BreadcrumbKitBundle\Service\BreadcrumbLoader:
    public: true
    arguments:
      $defaultLocale: '%nowo_breadcrumb_kit.default_locale_resolved%'
      $cachePool: null
      $cacheTtl: '%nowo_breadcrumb_kit.cache.ttl%'
      $profilerRecorder: '@Nowo\BreadcrumbKitBundle\Profiler\BreadcrumbProfilerRecorder'
      $hideWhenSingleRoot: '%nowo_breadcrumb_kit.presentation.hide_when_single_root%'
      $homeIconReplacesLabel: '%nowo_breadcrumb_kit.presentation.home_icon_replaces_label%'
      $defaultHomeIcon: '%nowo_breadcrumb_kit.presentation.home_icon%'
      $linkAccessChecker: null
      $currentLabel: '@Nowo\BreadcrumbKitBundle\Service\BreadcrumbCurrentLabel'

  # 2.17: request-scoped label of the current crumb (Twig breadcrumb_current_label(), setCurrentLabel() in PHP).
  # Cleared at main request / command / message boundaries by its own subscriber, never only by kernel.reset.
  Nowo\BreadcrumbKitBundle\Service\BreadcrumbCurrentLabel:
    public: true
    arguments:
      $requestStack: '@request_stack'
      $translator: '@?translator'

  Nowo\BreadcrumbKitBundle\Service\BreadcrumbCurrentLabelInterface:
    alias: Nowo\BreadcrumbKitBundle\Service\BreadcrumbCurrentLabel
    public: true

  # Doctrine onFlush/postFlush listener (AsDoctrineListener): drops cached item lists of changed collections.
  Nowo\BreadcrumbKitBundle\Service\BreadcrumbLoaderInterface:
    alias: Nowo\BreadcrumbKitBundle\Service\BreadcrumbLoader
    public: true

  Nowo\BreadcrumbKitBundle\Service\BreadcrumbCacheInvalidator:
    arguments:
      $cachePool: null

  # 2.16 (LI-BC-M1): per-transaction outbox of the collection-changed events, told about the real transactions of
  # the bundle's connection by the DBAL middleware (AfterCommitMiddlewarePass sets the connection).
  Nowo\BreadcrumbKitBundle\Doctrine\BreadcrumbChangeOutbox: ~

  Nowo\BreadcrumbKitBundle\Doctrine\AfterCommitMiddleware:
    arguments: ['@Nowo\BreadcrumbKitBundle\Doctrine\BreadcrumbChangeOutbox']
    tags: ['doctrine.middleware']

  Nowo\BreadcrumbKitBundle\Service\BreadcrumbInlineEditResolver:
    arguments:
      $inlineEditAccessCheckerLocator: '@nowo_breadcrumb_kit.inline_edit.access_checker_locator'
      $tokenStorage: '@?security.token_storage'
      $queryParamName: '%nowo_breadcrumb_kit.inline_edit.query_param%'
      $dashboardEnabled: '%nowo_breadcrumb_kit.dashboard.enabled%'

  Nowo\BreadcrumbKitBundle\Service\BreadcrumbExporter: ~

  Nowo\BreadcrumbKitBundle\Service\BreadcrumbEntityManagerResetter:
    arguments:
      $managerName: '%nowo_breadcrumb_kit.doctrine.entity_manager%'

  nowo_breadcrumb_kit.entity_manager:
    class: Doctrine\ORM\EntityManagerInterface
    factory: ['@Nowo\BreadcrumbKitBundle\Service\BreadcrumbEntityManagerResetter', 'entityManager']

  Nowo\BreadcrumbKitBundle\EventSubscriber\DashboardEntityManagerSubscriber: ~

  Nowo\BreadcrumbKitBundle\Service\BreadcrumbImporter: ~

  Nowo\BreadcrumbKitBundle\Service\BreadcrumbTrailPreview: ~

  Nowo\BreadcrumbKitBundle\Command\GenerateBreadcrumbKitMigrationCommand:
    arguments:
      $em: '@nowo_breadcrumb_kit.entity_manager'
      $connectionName: '%nowo_breadcrumb_kit.doctrine.connection%'
      $tablePrefix: '%nowo_breadcrumb_kit.table_prefix%'
    tags: ['console.command']

  Nowo\BreadcrumbKitBundle\Command\ExportBreadcrumbsCommand:
    tags: ['console.command']

  Nowo\BreadcrumbKitBundle\Command\ImportBreadcrumbsCommand:
    tags: ['console.command']

  Nowo\BreadcrumbKitBundle\Command\PreviewBreadcrumbTrailCommand:
    tags: ['console.command']

  Nowo\BreadcrumbKitBundle\Twig\BreadcrumbExtension:
    arguments:
      $defaultCollection: '%nowo_breadcrumb_kit.default_collection%'
      $currentLabel: '@Nowo\BreadcrumbKitBundle\Service\BreadcrumbCurrentLabelInterface'
    tags:
      - { name: twig.extension }

  Nowo\BreadcrumbKitBundle\Twig\BreadcrumbKitDashboardLinkExtension:
    arguments:
      $dashboardEnabled: '%nowo_breadcrumb_kit.dashboard.enabled%'
    tags:
      - { name: twig.extension }

  Nowo\BreadcrumbKitBundle\EventSubscriber\TablePrefixSubscriber:
    arguments:
      $tablePrefix: '%nowo_breadcrumb_kit.table_prefix%'

  # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
  Nowo\BreadcrumbKitBundle\Form\:
    resource: '../../Form/'
    exclude: '../../Form/DataTransformer/'
    tags: ['form.type']
