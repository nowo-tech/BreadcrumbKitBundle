name: breadcrumb-kit-bundle

services:
  php:
    build: .
    # Keep the container alive so `docker compose exec` (Makefile targets) works.
    command: ["tail", "-f", "/dev/null"]
    working_dir: /app
    volumes:
      - .:/app
      - coverage-data:/app/coverage
    environment:
      # REQ-TEST-005: real-server suite (tests/Database) runs against the services below (passwordless, local only).
      BREADCRUMB_TEST_DATABASE_URL: "mysql://root@mysql:3306/breadcrumb?serverVersion=8.4.0&charset=utf8mb4"
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: breadcrumb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: breadcrumb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  coverage-data:
